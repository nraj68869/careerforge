spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.data.web.pageable.max-page-size=50

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:careerforge}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.name=${ADMIN_NAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}